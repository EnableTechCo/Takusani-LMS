name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web application
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the secret scan reads the whole history
      # Secret scanning over every commit, not only the working tree: a key removed in a later commit is still
      # exposed. Reviewed false positives go in .gitleaksignore with the reason.
      - name: Secret scan (gitleaks)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.28.0 git /repo --redact --no-banner
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Known vulnerabilities in what ships (development tools excluded); Dependabot proposes the upgrades.
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  database:
    name: Database boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the migration rules compare against the base branch
      - name: Migration rules (names, immutability, order)
        run: bash scripts/check-migrations.sh ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
      - uses: supabase/setup-cli@v3
        with:
          version: 2.117.0 # keep in step with the supabase devDependency
      - run: supabase start
      - run: supabase db lint --local --level warning
      - run: supabase test db
      # Spike X-1 as a standing check: through the Data API, with only the publishable key or a learner's token,
      # nothing outside the api schema is reachable and nothing in it runs without an explicit grant.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Data API exposure (spike X-1)
        env:
          SUPABASE_CLI: supabase
        run: node scripts/check-data-api-exposure.mjs local
      # Spike X-5 as a standing check: a 25 MB evidence file goes straight to private Storage with the learner's
      # own session, survives an interrupted connection, and is only accepted after finalisation.
      - name: Resumable upload (spike X-5)
        env:
          SUPABASE_CLI: supabase
        run: node scripts/check-resumable-upload.mjs local
      - name: Generated database types are up to date
        run: |
          supabase gen types typescript --local --schema api > /tmp/database.ts
          if [ ! -f src/types/database.ts ]; then
            echo "::error::src/types/database.ts is missing. Run 'npm run db:types' with the local stack running, and commit it."
            cp /tmp/database.ts "$RUNNER_TEMP/database.ts"; exit 1
          fi
          if ! diff -u src/types/database.ts /tmp/database.ts; then
            echo "::error::src/types/database.ts is out of date. Run 'npm run db:types' and commit the result."
            cp /tmp/database.ts "$RUNNER_TEMP/database.ts"; exit 1
          fi
      - name: Upload the generated types when they differ
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: database-types
          path: ${{ runner.temp }}/database.ts
          if-no-files-found: ignore
