name: Deploy

# Staging: this repository's current Supabase and Vercel projects. Vercel's Git integration deploys main to the
# staging site on every merge; after CI passes, this workflow applies migrations and settings, then smoke-tests it.
# Production is added later (ADR-018): set the repository variable PRODUCTION_ENABLED=true and production deploys
# after staging passes, waits for approval, and is deployed by this workflow so migrations always run first.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  staging:
    if: >-
      ${{ vars.CD_ENABLED == 'true' &&
          (github.event_name == 'workflow_dispatch' ||
           github.event.workflow_run.conclusion == 'success') }}
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: staging
      ref: ${{ github.event.workflow_run.head_sha || github.sha }}
    secrets: inherit

  production:
    needs: staging
    if: ${{ vars.PRODUCTION_ENABLED == 'true' }}
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: production
      ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      deploy_app: true
    secrets: inherit
