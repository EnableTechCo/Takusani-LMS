name: Deploy

# main -> staging -> production (ADR-018). Production waits for staging to deploy and pass its smoke test,
# then for the approval required on the "production" GitHub environment.
# Vercel's own Git integration does not deploy main (vercel.json), so this is the only route to production.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  staging:
    if: >-
      ${{ vars.CD_ENABLED == 'true' &&
          (github.event_name == 'workflow_dispatch' ||
           github.event.workflow_run.conclusion == 'success') }}
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: staging
      ref: ${{ github.event.workflow_run.head_sha || github.sha }}
    secrets: inherit

  production:
    needs: staging
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: production
      ref: ${{ github.event.workflow_run.head_sha || github.sha }}
    secrets: inherit
