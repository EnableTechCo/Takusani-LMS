name: Deploy

# main -> staging, today. This repository's current Supabase and Vercel projects are the staging environment.
# Production is added later (ADR-018): when it exists, set the repository variable PRODUCTION_ENABLED=true and
# production will deploy after staging passes, then wait for the approval required on the "production" environment.
# Vercel's own Git integration does not deploy main (vercel.json), so this workflow is the only deploy route.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  staging:
    if: >-
      ${{ vars.CD_ENABLED == 'true' &&
          (github.event_name == 'workflow_dispatch' ||
           github.event.workflow_run.conclusion == 'success') }}
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: staging
      ref: ${{ github.event.workflow_run.head_sha || github.sha }}
    secrets: inherit

  production:
    needs: staging
    if: ${{ vars.PRODUCTION_ENABLED == 'true' }}
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: production
      ref: ${{ github.event.workflow_run.head_sha || github.sha }}
    secrets: inherit
